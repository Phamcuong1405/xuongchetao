<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MÁY BƠM NHÔM MINI</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5;color:#333}
.container{max-width:960px;margin:auto;padding:15px}
header{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff;text-align:center;padding:50px 15px}
h1{font-size:2.4rem}
.cta-btn{display:inline-block;background:#ffeb3b;color:#c62828;font-weight:bold;
padding:15px 40px;border-radius:40px;text-decoration:none;margin-top:20px}

section{padding:40px 0}
h2{text-align:center;color:#c62828}

.carousel{display:flex;transition:.5s}
.carousel img{width:100%;border-radius:12px}
.carousel-wrap{overflow:hidden;max-width:800px;margin:auto}

.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center}
.card h3{background:#c62828;color:#fff;padding:15px}
.price{font-size:2rem;color:#d32f2f;font-weight:bold}

.order-form{background:#ffebee}
label{display:block;margin-top:15px;font-weight:bold}
input{width:100%;padding:12px;margin-top:5px;font-size:1rem}
button{width:100%;margin-top:25px}
footer{background:#333;color:#fff;text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  <h1>MÁY BƠM NHÔM MINI ĐÚC</h1>
  <p>Bơm mạnh – nhỏ gọn – bền bỉ</p>
  <a href="#dat-hang" class="cta-btn">ĐẶT MUA NGAY</a>
</header>

<section>
<h2>Hình ảnh thực tế</h2>
<div class="carousel-wrap">
  <div class="carousel" id="carousel">
    <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-1.jpg">
    <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-2.jpg">
    <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may3.jpg">
  </div>
</div>
</section>

<section>
<h2>Chọn gói</h2>
<div class="pricing">
  <div class="card">
    <h3>1 CÁI</h3>
    <div class="price">250.000đ</div>
  </div>
  <div class="card">
    <h3>2 CÁI</h3>
    <div class="price">500.000đ</div>
  </div>
  <div class="card">
    <h3>3 CÁI</h3>
    <div class="price">750.000đ</div>
  </div>
</div>
</section>

<section class="order-form" id="dat-hang">
<div class="container">
<h2>Đặt hàng ngay</h2>

<form action="https://script.google.com/macros/s/AKfycbyKENrUcGSnV-F3ML4CeUJHdMoDBlPHoqpkc5CFfwGc3MIKy0Ry3FKwoeVduhgQ_jwY/exec"
method="POST">

<label>Số lượng</label>
<input name="so_luong" type="number" value="1" required>

<label>Họ tên</label>
<input name="ho_ten" required>

<label>Số điện thoại</label>
<input name="dien_thoai" required>

<label>Địa chỉ</label>
<input name="dia_chi" required>

<button class="cta-btn" type="submit">GỬI ĐƠN ĐẶT HÀNG</button>
</form>

</div>
</section>

<footer>
<p>XƯỞNG CHẾ TẠO</p>
<p>Hotline: 0888 526 832</p>
</footer>

<script>
let i=0;
setInterval(()=>{
  i=(i+1)%3;
  document.getElementById("carousel").style.transform=`translateX(-${i*100}%)`;
},4000);
</script>

</body>
</html>
