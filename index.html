<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐẶT HÀNG</title>
<style>
body{font-family:Arial;background:#f2f2f2}
form{max-width:400px;margin:30px auto;background:#fff;padding:20px;border-radius:8px}
input,textarea,button{width:100%;padding:10px;margin:8px 0}
button{background:#e53935;color:#fff;border:none;font-size:16px}
</style>
</head>

<body>

<form 
action="https://docs.google.com/forms/d/e/FORM_ID/formResponse"
method="POST"
target="hidden_iframe"
onsubmit="submitted=true;"
>

<input name="entry.111111111" placeholder="Tên khách hàng" required>
<input name="entry.222222222" placeholder="Số điện thoại" required>
<input name="entry.333333333" placeholder="Địa chỉ" required>
<input name="entry.444444444" type="number" value="1">
<textarea name="entry.555555555" placeholder="Ghi chú"></textarea>

<button type="submit">ĐẶT HÀNG</button>
</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
let submitted = false;
document.querySelector("form").onsubmit = function(){
  submitted = true;
  setTimeout(()=>{
    alert("ĐẶT HÀNG THÀNH CÔNG");
    document.querySelector("form").reset();
  },800);
}
</script>

</body>
</html>
