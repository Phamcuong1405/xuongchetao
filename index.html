<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MÁY BƠM NHÔM MINI</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f6;
}
.wrap{
  max-width:480px;
  margin:auto;
  background:#fff;
}
header{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:#fff;
  text-align:center;
  padding:40px 15px;
}
header h1{margin:0;font-size:26px}
.hot{
  background:#fff;
  color:#d32f2f;
  display:inline-block;
  padding:6px 16px;
  border-radius:20px;
  font-weight:bold;
  margin-top:10px;
}
section{padding:25px 15px}
img{width:100%;border-radius:12px}
label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}
input{
  width:100%;
  padding:12px;
  margin-top:5px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  margin-top:25px;
  width:100%;
  padding:16px;
  font-size:18px;
  background:#ffeb3b;
  color:#c00;
  border:none;
  border-radius:50px;
  font-weight:bold;
}
footer{
  background:#333;
  color:#fff;
  text-align:center;
  padding:20px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>MÁY BƠM NHÔM MINI ĐÚC</h1>
  <div class="hot">NHỎ GỌN – BỀN BỈ – HIỆU SUẤT CAO</div>
  <p>Giảm giá 50% – Ship COD toàn quốc</p>
</header>

<section>
  <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-1.jpg">
</section>

<section>
  <h3>ĐẶT HÀNG NGAY</h3>
  <p>Điền thông tin – Chúng tôi gọi xác nhận – Giao tận nơi</p>

  <!-- FORM GỬI THẲNG GOOGLE SHEET -->
  <form 
    method="POST"
    action="https://script.google.com/macros/s/AKfycbye5WTZfg-rAY0fSHSh9ZSRs5jWEhBkrPhLCuwiAgv-cRZBg44AVNwEK944AWRs6sAPtg/exec"
  >

    <label>Số lượng</label>
    <input type="number" name="quantity" value="1" min="1" required>

    <label>Họ và tên</label>
    <input type="text" name="name" required>

    <label>Số điện thoại</label>
    <input type="tel" name="phone" pattern="[0-9]{9,11}" required>

    <label>Địa chỉ nhận hàng</label>
    <input type="text" name="address" required>

    <button type="submit">ĐẶT HÀNG NGAY</button>
  </form>

  <p style="font-size:13px;color:#666;margin-top:15px">
    Nếu mở từ Facebook/Messenger → chọn “Mở bằng trình duyệt”
  </p>
</section>

<footer>
  <b>XƯỞNG CHẾ TẠO</b><br>
  Hotline: 0888 526 832<br>
  Ship COD toàn quốc
</footer>

</div>

</body>
</html>
