<form id="order-form">
  <input type="text" name="name" placeholder="Họ và tên" required>
  <input type="tel" name="phone" placeholder="Số điện thoại" required>
  <input type="text" name="address" placeholder="Địa chỉ nhận hàng" required>

  <select name="quantity">
    <option value="1">1 sản phẩm</option>
    <option value="2">2 sản phẩm</option>
    <option value="3">3 sản phẩm</option>
  </select>

  <input type="hidden" name="source" value="Web">

  <button type="submit">ĐẶT HÀNG NGAY</button>
</form>

<div id="order-msg" style="margin-top:10px;font-weight:bold"></div>
<script>
const form = document.getElementById("order-form");
const msg  = document.getElementById("order-msg");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  msg.innerHTML = "⏳ Đang gửi đơn...";

  const data = new FormData(form);

  fetch("https://script.google.com/macros/s/AKfycbXXXXXXXXXXXX/exec", {
    method: "POST",
    body: data
  })
  .then(res => res.json())
  .then(r => {
    if (r.success) {
      msg.innerHTML = "✅ ĐẶT HÀNG THÀNH CÔNG!";
      form.reset();
    } else {
      msg.innerHTML = "❌ " + r.msg;
    }
  })
  .catch(() => {
    msg.innerHTML = "❌ Lỗi gửi đơn. Thử lại!";
  });
});
</script>
