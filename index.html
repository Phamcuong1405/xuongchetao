<script>
  const form = document.getElementById('order-form');
  const overlay = document.getElementById('popupOverlay');
  const content = document.getElementById('popupContent');
  const icon = document.getElementById('popupIcon');
  const text = document.getElementById('popupText');
  const subtext = document.getElementById('popupSubtext');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    overlay.style.display = 'flex';
    content.className = 'popup-content loading';
    icon.innerHTML = '⏳';
    text.innerHTML = 'Đang gửi đơn đặt hàng...';
    subtext.innerHTML = 'Vui lòng chờ trong giây lát';

    const formData = new FormData(this);

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000); // Timeout 15 giây

      const response = await fetch(this.action, {
        method: 'POST',
        body: formData,
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Lỗi server: ${response.status} - ${errorText.substring(0, 100)}...`);
      }

      const contentType = response.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        const text = await response.text();
        throw new Error(`Server trả về không phải JSON: ${text.substring(0, 100)}...`);
      }

      const data = await response.json();

      if (data.result === 'success') {
        content.className = 'popup-content success';
        icon.innerHTML = '✅';
        text.innerHTML = 'Đặt hàng thành công!';
        subtext.innerHTML = 'Chúng tôi sẽ liên hệ sớm. Cảm ơn bạn!';
        form.reset();

        setTimeout(() => overlay.style.display = 'none', 3000);
      } else {
        throw new Error(data.message || 'Không rõ');
      }
    } catch (error) {
      content.className = 'popup-content error';
      icon.innerHTML = '❌';
      text.innerHTML = 'Gửi đơn thất bại!';
      subtext.innerHTML = error.message + '<br>Thử mở link web trực tiếp trên Chrome/Safari hoặc dùng nút "Mở web trong trình duyệt" bên dưới.';
      setTimeout(() => overlay.style.display = 'none', 6000);
      console.error('Fetch error:', error);
    }
  });
</script>
