<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MÁY BƠM NHÔM MINI - Xưởng Chế Tạo</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #f8f8f8; scroll-behavior: smooth; }
    .container { max-width: 980px; margin: 0 auto; padding: 0 15px; }
    header { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; text-align: center; padding: 60px 15px 40px; }
    header h1 { font-size: 2.5rem; margin-bottom: 12px; }
    .cta-btn { display: inline-block; background: #ffeb3b; color: #d50000; font-size: 1.3rem; font-weight: bold; padding: 15px 40px; border-radius: 50px; text-decoration: none; margin: 20px 0; box-shadow: 0 5px 0 #ffb300; border: none; cursor: pointer; }
    .cta-btn:disabled { background: #ccc; box-shadow: none; }
    .carousel-container { position: relative; max-width: 600px; margin: 20px auto; overflow: hidden; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .carousel { display: flex; transition: transform 0.5s ease-in-out; }
    .carousel-item { min-width: 100%; }
    .carousel-item img { width: 100%; display: block; }
    .pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }
    .card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
    .order-section { background: #ffebee; padding: 40px 15px; }
    .order-form-box { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; }
    input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
    footer { background: #333; color: white; text-align: center; padding: 30px; }
  </style>
</head>
<body>

<header>
  <h1>MÁY BƠM NHÔM MINI ĐÚC</h1>
  <div style="background:#fff; color:#d32f2f; display:inline-block; padding:5px 15px; border-radius:20px; font-weight:bold;">GIẢM GIÁ 50% HÔM NAY</div>
</header>

<div class="carousel-container">
  <div class="carousel" id="carousel">
    <div class="carousel-item"><img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-1.jpg"></div>
    <div class="carousel-item"><img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-2.jpg"></div>
    <div class="carousel-item"><img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may3.jpg"></div>
  </div>
</div>

<section id="dat-hang" class="order-section">
  <div class="order-form-box">
    <h2 style="text-align:center; color:#c62828;">ĐẶT HÀNG NHANH</h2>
    <form id="mainOrderForm">
      <input type="text" name="name" placeholder="Họ tên của bạn" required>
      <input type="tel" name="phone" id="phoneField" placeholder="Số điện thoại" required>
      <input type="text" name="address" placeholder="Địa chỉ nhận hàng" required>
      <select name="package" id="packageSelect">
        <option value="Gói 1 cái - 250k">Gói 1 cái - 250.000đ</option>
        <option value="Gói 2 cái - 500k">Gói 2 cái - 500.000đ (Free Ship)</option>
      </select>
      <input type="text" name="note" placeholder="Ghi chú thêm">
      <button type="submit" id="submitBtn" class="cta-btn" style="width:100%;">XÁC NHẬN ĐẶT HÀNG</button>
    </form>
    <div id="order-msg" style="text-align:center; margin-top:15px; font-weight:bold;"></div>
  </div>
</section>

<footer>
  <p>XƯỞNG CHẾ TẠO - 0888 526 832</p>
</footer>

<script>
  // Carousel
  let currentSlide = 0;
  function moveSlide() {
    currentSlide = (currentSlide + 1) % 3;
    document.getElementById('carousel').style.transform = `translateX(-${currentSlide * 100}%)`;
  }
  setInterval(moveSlide, 4000);

  // Gửi đơn hàng
  const API_URL = "https://script.google.com/macros/s/AKfycbxaQdIPRFnkyDAAmaMnBPSdk-41Ng7sDf1OrYkZRLEXHc5c4b-sad8JnJLVYv5AWpOEoA/exec";

  document.getElementById("mainOrderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("order-msg");
    const phone = document.getElementById("phoneField").value;

    // Chống spam
    if (localStorage.getItem("ordered") === phone) {
      msg.innerHTML = "⚠️ Bạn đã gửi đơn hàng này rồi.";
      return;
    }

    btn.disabled = true;
    btn.innerText = "ĐANG GỬI...";

    // Chuyển sang URL tham số (Xử lý lỗi iOS Messenger)
    const params = new URLSearchParams({
      name: this.name.value,
      phone: phone,
      address: this.address.value,
      package: this.package.value,
      note: this.note.value,
      source: "Messenger-iOS-Fix"
    });

    // Gửi bằng FETCH GET - Đây là cách ổn định nhất cho iOS
    fetch(`${API_URL}?${params.toString()}`, {
      method: 'GET',
      mode: 'no-cors'
    })
    .then(() => {
      // Vì no-cors không trả về nội dung, ta mặc định là thành công sau khi gửi đi
      msg.style.color = "green";
      msg.innerHTML = "✅ ĐẶT HÀNG THÀNH CÔNG!";
      localStorage.setItem("ordered", phone);
      this.reset();
      btn.innerText = "ĐÃ XÁC NHẬN";
    })
    .catch(err => {
      msg.style.color = "red";
      msg.innerHTML = "❌ Lỗi: Vui lòng gọi 0888 526 832";
      btn.disabled = false;
      btn.innerText = "XÁC NHẬN ĐẶT HÀNG";
    });
  });
</script>
</body>
</html>
