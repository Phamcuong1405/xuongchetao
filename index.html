<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MÁY BƠM NHÔM MINI</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; text-align: center; }
    .box { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .btn { width: 100%; padding: 15px; background: #ff4b2b; color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 18px; }
  </style>
</head>
<body>

<div class="box">
  <h2 style="color:#d32f2f;">ĐẶT HÀNG NHANH</h2>
  <form id="orderForm">
    <input type="text" name="name" placeholder="Họ và Tên" required>
    <input type="tel" name="phone" placeholder="Số điện thoại" required>
    <input type="text" name="address" placeholder="Địa chỉ nhận hàng" required>
    <select name="package">
      <option value="1 cái - 250k">1 máy bơm - 250.000đ</option>
      <option value="2 cái - 500k">2 máy bơm - 500.000đ (Free Ship)</option>
    </select>
    <input type="text" name="note" placeholder="Ghi chú">
    <button type="submit" id="btnSubmit" class="btn">XÁC NHẬN ĐẶT HÀNG</button>
  </form>
  <div id="msg" style="margin-top:15px; font-weight:bold;"></div>
</div>

<script>
  // LINK API CỦA BẠN
  const API_URL = "https://script.google.com/macros/s/AKfycbyC9ZqEzpvd-q1afHQvO1hboWUeaRyyW_0Uo0a3rwZO4IQVQbXqP0y3syIYfQzpfo88jQ/exec";

  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("btnSubmit");
    const msg = document.getElementById("msg");

    btn.disabled = true;
    btn.innerText = "ĐANG GỬI...";

    const params = new URLSearchParams({
      name: this.name.value,
      phone: this.phone.value,
      address: this.address.value,
      package: this.package.value,
      note: this.note.value,
      source: "Web-Fix-iOS"
    });

    const finalUrl = API_URL + "?" + params.toString();
    
    // Gửi bằng Image - Cách an toàn nhất cho iPhone/Messenger
    const img = new Image();
    img.src = finalUrl;

    setTimeout(() => {
      msg.style.color = "green";
      msg.innerHTML = "✅ ĐẶT HÀNG THÀNH CÔNG!";
      this.reset();
      btn.disabled = false;
      btn.innerText = "XÁC NHẬN ĐẶT HÀNG";
    }, 1500);
  });
</script>
</body>
</html>
