<section class="order-form">
  <div class="container">
    <h2>Đặt hàng ngay chỉ với 1 bước</h2>
    <p style="font-size:1.3rem; margin:20px 0;">Nhập thông tin → Nhân viên xác nhận → Giao hàng tận nơi</p>
    
    <form id="dat-hang-form" action="https://script.google.com/macros/s/AKfycbx8oIos7Sbj-cgnHQXBioEMmutfmjHZ1JGYpfAJs9I5IzocinGRqKFoziRS72XftDphBw/exec" method="POST">
      <!-- Số lượng -->
      <label for="so-luong" style="display:block; font-size:1.2rem; margin:15px 0 5px;">Số lượng:</label>
      <input type="number" id="so-luong" name="so-luong" min="1" placeholder="Ví dụ: 3" required style="width:100%; max-width:420px; padding:12px; font-size:1.2rem; border:2px solid #ccc; border-radius:8px;"/>

      <!-- Họ tên -->
      <label for="ho-ten" style="display:block; font-size:1.2rem; margin:15px 0 5px;">Họ và tên:</label>
      <input type="text" id="ho-ten" name="ho-ten" placeholder="Ví dụ: Nguyễn Văn Cường" required style="width:100%; max-width:420px; padding:12px; font-size:1.2rem; border:2px solid #ccc; border-radius:8px;"/>

      <!-- Số điện thoại -->
      <label for="so-dien-thoai" style="display:block; font-size:1.2rem; margin:15px 0 5px;">Số điện thoại:</label>
      <input type="tel" id="so-dien-thoai" name="so-dien-thoai" placeholder="Ví dụ: 0888526832" required pattern="[0-9]{9,11}" style="width:100%; max-width:420px; padding:12px; font-size:1.2rem; border:2px solid #ccc; border-radius:8px;"/>

      <!-- Địa chỉ -->
      <label for="dia-chi" style="display:block; font-size:1.2rem; margin:15px 0 5px;">Địa chỉ nhận hàng:</label>
      <input type="text" id="dia-chi" name="dia-chi" placeholder="Ví dụ: Số 123 Đường ABC, Quận XYZ, Hà Nội" required style="width:100%; max-width:420px; padding:12px; font-size:1.2rem; border:2px solid #ccc; border-radius:8px;"/>

      <!-- Nút đặt hàng -->
      <button type="submit" class="cta-btn" style="margin:30px 0 0; width:100%; max-width:420px;">ĐẶT HÀNG NGAY</button>
    </form>

    <!-- JS xử lý submit (thêm thông báo thành công, ngăn reload) -->
    <script>
      const form = document.getElementById('dat-hang-form');
      form.addEventListener('submit', function(e) {
        e.preventDefault();  // Ngăn reload trang
        const formData = new FormData(form);
        
        fetch(form.action, {
          method: 'POST',
          body: formData
        })
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            alert('Đặt hàng thành công! Chúng tôi sẽ liên hệ sớm.');
            form.reset();  // Xóa form
          } else {
            alert('Có lỗi: ' + data.message);
          }
        })
        .catch(error => alert('Lỗi kết nối: ' + error));
      });
    </script>
  </div>
</section>
