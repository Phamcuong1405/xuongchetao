<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>XƯỞNG CHẾ TẠO - ĐẶT HÀNG</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f2f2f2;
  color:#222;
}
.wrap{
  max-width:480px;
  margin:auto;
  background:#fff;
}
header{
  background:#c62828;
  color:#fff;
  padding:20px;
  text-align:center;
}
.section{
  padding:20px;
}
.package{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}
.btn{
  display:block;
  background:#c62828;
  color:#fff;
  text-align:center;
  padding:12px;
  border-radius:8px;
  text-decoration:none;
  margin-top:10px;
}
input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:16px;
}
footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <h2>MÁY BƠM MINI 12V</h2>
  <p>Bền – Mạnh – Giá xưởng</p>
</header>

<div class="section">
  <div class="package">
    <h3>GÓI 1 CÁI</h3>
    <p>Giá: 250.000đ</p>
    <a href="#order" class="btn" onclick="selectPackage(1)">MUA NGAY</a>
  </div>

  <div class="package">
    <h3>GÓI 2 CÁI</h3>
    <p>Giá: 470.000đ</p>
    <a href="#order" class="btn" onclick="selectPackage(2)">CHỌN GÓI NÀY</a>
  </div>

  <div class="package">
    <h3>GÓI 3 CÁI</h3>
    <p>Giá: 680.000đ</p>
    <a href="#order" class="btn" onclick="selectPackage(3)">MUA GÓI SIÊU TIẾT KIỆM</a>
  </div>
</div>

<div class="section" id="order">
  <h3>THÔNG TIN ĐẶT HÀNG</h3>

  <form id="order-form" method="POST"
    action="https://script.google.com/macros/s/AKfycbyNnLWAwYetYmeX7u43j11j8NF_AtH5bgQYMYvyncso2wRX9yKN9XYp4U8bv1MpLY4T/exec">

    <input name="Họ tên" placeholder="Họ và tên" required>
    <input id="phone" name="Số điện thoại" placeholder="Số điện thoại" required>
    <textarea name="Địa chỉ" placeholder="Địa chỉ nhận hàng"></textarea>

    <input id="quantity" name="Số lượng" value="1" readonly>

    <!-- INPUT ẨN -->
    <input type="hidden" id="package" name="Gói mua" value="Gói 1 cái">
    <input type="hidden" id="price" name="Đơn giá" value="0">
    <input type="hidden" id="total" name="Tổng tiền" value="0">
    <input type="hidden" id="source" name="Nguồn khách" value="Website">

    <div id="show-total" style="margin-top:10px;font-weight:bold;color:#c62828"></div>

    <button class="btn" type="submit">GỬI ĐƠN HÀNG</button>
  </form>
</div>

<footer>
  © Xưởng Chế Tạo
</footer>

</div>

<!-- MODAL -->
<div id="modal" style="
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999">
  <div style="
    background:#fff;
    padding:25px;
    border-radius:12px;
    text-align:center;
    max-width:320px">
    <h3 id="modal-title"></h3>
    <p id="modal-msg" style="margin:15px 0"></p>
    <button class="btn" onclick="closeModal()">Đóng</button>
  </div>
</div>

<!-- LOADING -->
<div id="loading" style="
  position:fixed;inset:0;
  background:rgba(255,255,255,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9998;
  font-size:20px;
  font-weight:bold;
  color:#c62828">
  ĐANG GỬI ĐƠN HÀNG...
</div>

<script>
/* GIÁ */
const PRICE = {1:250000,2:470000,3:680000};

function selectPackage(qty){
  const total = PRICE[qty];
  quantity.value = qty;
  package.value = `Gói ${qty} cái`;
  price.value = PRICE[qty];
  totalInput.value = total;
  showTotal(total);
}

function showTotal(v){
  show-total.innerText = "Tổng tiền: " + v.toLocaleString() + "đ";
}

/* NGUỒN KHÁCH */
(function(){
  const p=new URLSearchParams(location.search);
  let s="Website";
  if(p.get("utm_source")){
    const x=p.get("utm_source").toLowerCase();
    if(x.includes("facebook")) s="Facebook";
    else if(x.includes("zalo")) s="Zalo";
    else s=x;
  }
  source.value=s;
})();

/* GỬI FORM */
const form=document.getElementById("order-form");
const loading=document.getElementById("loading");

form.addEventListener("submit",e=>{
  e.preventDefault();

  if(!/^[0-9]{9,11}$/.test(phone.value)){
    showModal("LỖI","Số điện thoại không hợp lệ");
    return;
  }

  loading.style.display="flex";

  fetch(form.action,{
    method:"POST",
    body:new FormData(form)
  })
  .then(r=>r.json())
  .then(d=>{
    loading.style.display="none";
    if(d.result==="success"){
      showModal("THÀNH CÔNG","🎉 Đặt hàng thành công!");
      form.reset();
    }else{
      showModal("LỖI",d.message);
    }
  })
  .catch(()=>{
    loading.style.display="none";
    showModal("LỖI","Không kết nối được máy chủ");
  });
});

function showModal(t,m){
  modal-title.innerText=t;
  modal-msg.innerText=m;
  modal.style.display="flex";
}
function closeModal(){
  modal.style.display="none";
}
</script>

</body>
</html>
