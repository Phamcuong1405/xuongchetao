<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MÁY BƠM NHÔM MINI - Xưởng Chế Tạo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f8f8f8;color:#333;line-height:1.6
}
.container{max-width:980px;margin:auto;padding:0 15px}

header{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:#fff;text-align:center;padding:60px 15px 40px
}
header h1{font-size:2.6rem;margin-bottom:10px}
.hot{
  background:#fff;color:#d32f2f;font-weight:bold;
  padding:6px 16px;border-radius:30px;display:inline-block
}

section{padding:50px 0}
h2{text-align:center;color:#c62828;font-size:2.2rem;margin-bottom:25px}

.cta-btn{
  background:#ffeb3b;color:#d50000;
  font-size:1.4rem;font-weight:bold;
  padding:15px 40px;border-radius:50px;
  border:none;cursor:pointer
}

/* FORM */
.order-form{background:#ffebee;text-align:center}
.order-form label{
  display:block;text-align:left;
  max-width:420px;margin:15px auto 5px;font-size:1.1rem
}
.order-form input{
  width:100%;max-width:420px;
  padding:12px;font-size:1.1rem;
  border:2px solid #ef9a9a;border-radius:8px;
  display:block;margin:0 auto
}

/* CAROUSEL */
.carousel-container{
  max-width:800px;margin:auto;overflow:hidden;
  border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)
}
.carousel{display:flex;transition:.5s}
.carousel-item{min-width:100%}
.carousel-item img{width:100%;display:block}
.carousel-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.5);color:#fff;
  border:none;font-size:2rem;padding:8px 14px;
  cursor:pointer;border-radius:50%
}
.carousel-arrow.left{left:10px}
.carousel-arrow.right{right:10px}

footer{
  background:#333;color:#fff;text-align:center;
  padding:40px 20px;font-size:.95rem
}
</style>
</head>

<body>

<header>
  <div class="container">
    <h1>MÁY BƠM NHÔM MINI ĐÚC</h1>
    <div class="hot">BƠM NHANH – NHỎ GỌN – BỀN BỈ</div>
  </div>
</header>

<section>
  <div class="container">
    <h2>Hình ảnh thực tế</h2>

    <div class="carousel-container" style="position:relative">
      <div class="carousel" id="carousel">
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-1.jpg">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may-2.jpg">
        </div>
        <div class="carousel-item">
          <img src="https://raw.githubusercontent.com/Phamcuong1405/xuongchetao/main/may3.jpg">
        </div>
      </div>
      <button class="carousel-arrow left" onclick="moveSlide(-1)">‹</button>
      <button class="carousel-arrow right" onclick="moveSlide(1)">›</button>
    </div>
  </div>
</section>

<section class="order-form">
  <div class="container">
    <h2>Đặt hàng ngay</h2>

    <!-- ✅ FORM THUẦN – KHÔNG JS -->
  <form id="orderForm">
  <input type="hidden" name="source" value="Web">

  <label>Số lượng</label>
  <input type="number" name="quantity" value="1" min="1" required>

  <label>Họ tên</label>
  <input type="text" name="name" required>

  <label>Số điện thoại</label>
  <input type="tel" name="phone" required>

  <label>Địa chỉ</label>
  <input type="text" name="address" required>

  <br>
  <button type="submit" class="cta-btn">ĐẶT HÀNG NGAY</button>
</form>

<p id="msg" style="margin-top:15px;font-weight:bold"></p>


    <p style="font-size:13px;color:#666;margin-top:10px">
      Nếu mở từ Facebook/Messenger hãy dùng Chrome hoặc Safari
    </p>
  </div>
</section>

<footer>
  <p><b>XƯỞNG CHẾ TẠO</b></p>
  <p>Hotline: 0888 526 832</p>
</footer>

<!-- ✅ JS CAROUSEL DUY NHẤT -->
<script>
let currentSlide = 0;
const slides = document.querySelectorAll(".carousel-item");
const totalSlides = slides.length;

function moveSlide(n){
  currentSlide = (currentSlide + n + totalSlides) % totalSlides;
  document.getElementById("carousel").style.transform =
    "translateX(-"+currentSlide*100+"%)";
}
</script>
<script>
const form = document.getElementById("orderForm");
const msg  = document.getElementById("msg");

form.addEventListener("submit", function(e){
  e.preventDefault();
  msg.textContent = "⏳ Đang gửi đơn...";

  fetch("https://script.google.com/macros/s/AKfycbyNnLWAwYetYmeX7u43j11j8NF_AtH5bgQYMYvyncso2wRX9yKN9XYp4U8bv1MpLY4T/exec", {
    method: "POST",
    body: new FormData(form)
  })
  .then(r => r.json())
  .then(res => {
    if(res.success){
      msg.style.color = "green";
      msg.textContent = "✅ Đặt hàng thành công! Chúng tôi sẽ liên hệ sớm.";
      form.reset();
    }else{
      msg.style.color = "red";
      msg.textContent = "❌ " + res.msg;
    }
  })
  .catch(() => {
    msg.style.color = "red";
    msg.textContent = "❌ Lỗi kết nối, vui lòng thử lại";
  });
});
</script>

</body>
</html>
